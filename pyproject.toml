[project]
name = "idae"
description = "A PEP 772 implementation"
authors = [{ name = "Bryan Hu", email = "thatxliner@gmail.com" }]
version = "1.1.0"
requires-python = ">=3.8"

readme = "README.md"
license = "GPL-3.0-or-later"

classifiers = [
    # Get the list of trove classifiers here: https://pypi.org/classifiers/
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
]
keywords = ["script", "cli", "python", "typer"] # Maximum of 5 keywords

dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
    "platformdirs>=4.0.0",
    "packaging>=23.2",
    "findpython>=0.4.0,<0.5.0",
    "typer[all]>=0.9.0,<0.10.0",
    # We import click.exceptions directly; cap below 8.2 since the test suite's
    # CliRunner(mix_stderr=...) was removed there (typer 0.9 still ships it).
    "click>=8.1.7,<8.2",
    "typing-extensions>=4.8.0; python_version < '3.9'",
]

[project.urls]
Homepage = "https://github.com/ThatXliner/idae"

[project.scripts]
idae = "idae.cli:cli"

[dependency-groups]
dev = [
    "black>=23.11.0,<24.0.0",
    "hypothesis>=6.90.0,<7.0.0",
    "mypy>=1.7.1,<2.0.0",
    "pytest>=7.4.3,<8.0.0",
    "pytest-clarity>=1.0.1,<2.0.0; platform_system != 'Windows'",
    "pytest-cov>=4.1.0,<5.0.0",
    "shed>=0.10.9,<0.11.0",
    "toml>=0.10.2,<0.11.0",
    "ruff>=0.4.5,<0.5.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
# Same as Black.
line-length = 88
target-version = "py38"
extend-exclude = ["tests/examples/*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # "D",    # "No docs"
    "T20", # "Don't use print or pprint"
    # "ANN",  # Type annotation errors (or the lack of it)
    "ANN101", # The type annotation for `self` is inferred
    "FBT",    # I actually don't know why this exists
    # and it seems useless so ignore it
    # Fix doc rule conflicts
    "D203",
    "D213",
    "FIX002", # `TODO` comments are fine when linking to issues
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "D", "ANN201"]
"docs/conf.py" = ["INP001", "A001"]
